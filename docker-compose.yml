# News Pipeline - Root Orchestration
#
# Usage:
#   docker compose up -d          # Start all services
#   docker compose ps             # Check service health
#   docker compose logs -f kafka  # Tail logs for a service
#   docker compose down -v        # Stop and remove volumes
#
# Prerequisites:
#   - Models must be available in ./services/news-model-api/models/

services:
  # ---------------------------------------------------------------------------
  # Kafka (KRaft mode - no Zookeeper)
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: news-pipeline-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft settings
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Broker settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Kafka topic initialization (one-shot)
  # ---------------------------------------------------------------------------
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: news-pipeline-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Creating Kafka topics..."
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic raw_news --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic enriched_news --partitions 3 --replication-factor 1
        echo "Topics created:"
        kafka-topics --bootstrap-server kafka:29092 --list
    restart: "no"

  # ---------------------------------------------------------------------------
  # MongoDB
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:7
    container_name: news-pipeline-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # News Model API (FastAPI + ONNX)
  # ---------------------------------------------------------------------------
  news-model-api:
    build:
      context: ./services/news-model-api
      dockerfile: Dockerfile
      target: production
    container_name: news-pipeline-model-api
    ports:
      - "9000:9000"
    volumes:
      - ./services/news-model-api/models/sentiment_model:/app/models/sentiment_model:ro
      - ./services/news-model-api/models/topic_model:/app/models/topic_model:ro
    environment:
      - HOST=0.0.0.0
      - PORT=9000
      - SENTIMENT_MODEL_DIR=/app/models/sentiment_model
      - TOPIC_MODEL_DIR=/app/models/topic_model
      - DEVICE=${DEVICE:-cpu}
      - MAX_LENGTH=${MAX_LENGTH:-512}
      - BATCH_SIZE=${BATCH_SIZE:-32}
      - MAX_ITEMS_PER_REQUEST=${MAX_ITEMS_PER_REQUEST:-500}
      - MAX_CHARS_PER_ITEM=${MAX_CHARS_PER_ITEM:-5000}
      - RETURN_TOP_K=${RETURN_TOP_K:-3}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

volumes:
  kafka-data:
  mongo-data:
